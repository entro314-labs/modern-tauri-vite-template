[package]
name = "tauri-app"
version = "1.0.0"
description = "A production-ready Tauri 2 scaffold"
authors = ["community"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.5" }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.10.2" }